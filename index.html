<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farms Sim – Maize</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1e8;--fg:#1f2a1c;--card:#fff;--mut:#5d6b58;--a:#3f7d2a;--b:#c9701f;--bad:#b3402a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a12;--fg:#e8efe3;--card:#1f281c;--mut:#9fb099;--a:#7cc260;--b:#f0974a;--bad:#e8715a}}
:root[data-theme="dark"]{--bg:#141a12;--fg:#e8efe3;--card:#1f281c;--mut:#9fb099;--a:#7cc260;--b:#f0974a;--bad:#e8715a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:640px;margin-inline:auto;padding:12px}
h1{font-size:18px;margin:4px 0 8px}
#v{width:100%;height:290px;border-radius:14px;overflow:hidden;background:linear-gradient(#9fd0f0,#e6f3e0 75%);touch-action:none}
canvas{display:block;width:100%;height:100%}
.card{background:var(--card);border-radius:14px;padding:12px;margin-top:10px}
label{display:flex;justify-content:space-between;font-size:14px;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--fg)}
select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font-size:14px;margin-top:4px}
.tabs{display:flex;gap:8px}.tabs button{flex:1;padding:10px;border-radius:10px;border:2px solid var(--mut);background:var(--card);color:var(--fg);font-weight:600;font-size:14px}
.tabs button.on.A{border-color:var(--a);background:var(--a);color:#fff}.tabs button.on.B{border-color:var(--b);background:var(--b);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 4px;text-align:left}th{font-size:12px;color:var(--mut);font-weight:500}
.A{color:var(--a)}.B{color:var(--b)}td.A,td.B{font-weight:600}
.w{color:var(--bad);font-size:12px}
</style></head><body>
<h1>🌽 Maize growth simulator</h1>
<div id="v"></div>
<div class="card"><table>
<tr><th></th><th class="A">A (left)</th><th class="B">B (right)</th></tr>
<tr><th>Stage</th><td class="A" id="sa"></td><td class="B" id="sb"></td></tr>
<tr><th>Height</th><td class="A" id="ha"></td><td class="B" id="hb"></td></tr>
<tr><th>Est. yield</th><td class="A" id="ya"></td><td class="B" id="yb"></td></tr>
<tr><th>Alerts</th><td class="w" id="wa"></td><td class="w" id="wb"></td></tr>
</table></div>
<div class="card">
<label><span>Days after planting (both)</span><b id="dv"></b></label><input id="day" type="range" min="0" max="160" value="70">
</div>
<div class="card">
<div class="tabs"><button class="A on" id="tA">Edit scenario A</button><button class="B" id="tB">Edit scenario B</button></div>
<label style="margin-top:12px"><span>Crop</span></label>
<select id="crop"><option value="maize">🌽 Maize</option><option value="tobacco">🍃 Tobacco</option><option value="wheat">🌾 Wheat</option><option value="soy">🫘 Soybeans</option></select>
<label><span>Variety</span></label>
<select id="var"><option value="early">Early (short season)</option><option value="medium" selected>Medium season</option><option value="late">Late (long season)</option></select>
<label><span>Soil</span></label>
<select id="soil"><option value="sandy">Sandy (drains fast)</option><option value="loam" selected>Loam</option><option value="clay">Clay (holds water)</option></select>
<label><span>Avg temperature (°C)</span><b id="tv"></b></label><input id="tmp" type="range" min="0" max="42">
<label><span>Rainfall (mm/week)</span><b id="rv"></b></label><input id="rain" type="range" min="0" max="100">
<label><span>Nitrogen (kg/ha)</span><b id="nv"></b></label><input id="nit" type="range" min="0" max="250">
</div>
<p style="font-size:12px;color:var(--mut)">Prototype with placeholder variety and soil numbers, to be replaced with real local data. Drag the scene to rotate.</p>
<script src="three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const V={early:{g:0.85,p:0.75},medium:{g:1,p:1},late:{g:1.15,p:1.17}};
const CROPS={
 maize:{id:'maize',base:10,cap:30,veg:1400,mat:2700,pot:12,h:2.6,heat:34,cold:14,wopt:25},
 tobacco:{id:'tobacco',base:13,cap:30,veg:900,mat:1500,pot:3,h:1.7,heat:35,cold:15,wopt:20},
 wheat:{id:'wheat',base:5,cap:25,veg:900,mat:1900,pot:6,h:1.0,heat:28,cold:2,wopt:18},
 soy:{id:'soy',base:10,cap:30,veg:800,mat:1500,pot:3.5,h:0.9,heat:33,cold:15,wopt:22}};
const SOIL={sandy:{k:0.75,wl:80},loam:{k:1,wl:70},clay:{k:1.1,wl:55}};
const sc=[{crop:'maize',v:'medium',soil:'loam',T:24,R:30,N:120},{crop:'maize',v:'medium',soil:'sandy',T:30,R:12,N:60}];
let cur=0;
const el=$('v'),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,0.1,60);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));el.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b5a3a,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.7);sun.position.set(3,5,2);scene.add(sun);
const grounds=[-1.5,1.5].map(x=>{const g=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,0.1,36),new THREE.MeshLambertMaterial({color:0x6b4a2c}));g.position.set(x,-0.05,0);scene.add(g);return g});
const plants=[-1.5,1.5].map(x=>{const g=new THREE.Group();g.position.x=x;scene.add(g);return g});
let ang=0.4,drag=false,lx=0;
function size(){const w=el.clientWidth,h=el.clientHeight;ren.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
el.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(drag){ang+=(e.clientX-lx)*0.01;lx=e.clientX}});
function model(day,s){
  const c=CROPS[s.crop],vr=V[s.v],so=SOIL[s.soil];
  const v={veg:c.veg*vr.g,mat:c.mat*vr.g,pot:c.pot*vr.p};
  const gdd=day*Math.max(0,Math.min(s.T,c.cap)-c.base);
  let w=Math.min(1,s.R*so.k/c.wopt);if(s.R>so.wl)w=Math.max(0.5,1-(s.R-so.wl)/60);
  const n=Math.min(1,0.4+s.N/200);
  const heat=s.T>c.heat?Math.max(0.3,1-(s.T-c.heat)*0.08):(s.T<c.cold?0.7:1);
  return{v,c,gdd,w,n,heat,st:Math.min(w,n)*heat,silk:v.veg+50,s};
}
function stage(m){const g=m.gdd,v=m.v;
  if(g<100)return'Germination';if(g<v.veg)return'Vegetative';if(g<m.silk)return'Tasseling';
  if(g<v.mat*0.7)return'Grain fill';if(g<v.mat)return'Dough → dent';return'Mature'}
function makeLeaf(len,wid,droop){
  const geo=new THREE.PlaneGeometry(1,1,14,2),p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const u=p.getX(i)+0.5,v=p.getY(i);
    const w=wid*Math.sin(Math.PI*Math.pow(u,0.6))*(1-0.25*u);
    p.setXYZ(i,u*len,Math.sin(u*1.7)*len*0.32-droop*u*u*len*0.85+Math.sin(u*22)*0.006*Math.abs(v*2),v*2*w);
  }
  geo.computeVertexNormals();return geo;
}
function build(grp,m){
  grp.traverse(o=>{if(o.geometry)o.geometry.dispose()});
  while(grp.children.length)grp.remove(grp.children[0]);
  const v=m.v,s=m.st,prog=Math.min(1,m.gdd/v.veg);
  const H=m.c.h*Math.pow(prog,0.8)*(0.45+0.55*s);
  const old=m.gdd>v.mat*0.74?Math.min(1,(m.gdd-v.mat*0.74)/(v.mat*0.26)):0;
  const col=new THREE.Color(0x3f9a2a).lerp(new THREE.Color(0xb59a45),Math.min(1,(1-s)*0.9)).lerp(new THREE.Color(0x8a6a3a),old);
  if(m.gdd<100||H<0.02)return;
  if(m.c.id!=='maize'){buildOther(grp,m,H,col,old,prog);return}
  const sm=new THREE.MeshLambertMaterial({color:col.clone().multiplyScalar(0.85)});
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.055,H,10),sm);stem.position.y=H/2;grp.add(stem);
  for(let k=1;k<9;k++){const nd=new THREE.Mesh(new THREE.TorusGeometry(0.055-0.035*k/9,0.008,6,12),sm);nd.rotation.x=Math.PI/2;nd.position.y=H*k/9;grp.add(nd)}
  for(let k=0;k<5;k++){const r=new THREE.Mesh(new THREE.ConeGeometry(0.02,0.25,5),new THREE.MeshLambertMaterial({color:0xb8a27a}));
    const g=new THREE.Group();g.add(r);r.position.set(0.1,0.08,0);r.rotation.z=-1.0;g.rotation.y=k*1.26;grp.add(g)}
  const nl=Math.max(2,Math.floor(Math.min(16,m.gdd/(v.veg/16.5))));
  for(let i=0;i<nl;i++){
    const f=(i+1)/(nl+1);
    const len=(0.5+0.7*Math.sin(Math.PI*Math.min(1,f*1.1)))*(0.5+0.5*s)*Math.min(1,0.4+prog);
    const mat=new THREE.MeshLambertMaterial({color:col.clone().offsetHSL(0,0,i%2?0.03:-0.025),side:THREE.DoubleSide});
    const leaf=new THREE.Mesh(makeLeaf(len*1.15,0.075*(0.6+0.4*s),0.35+0.3*(1-s)+old*0.5+f*0.2),mat);
    const g=new THREE.Group();g.add(leaf);leaf.rotation.x=0.12*Math.sin(i);
    g.position.y=H*(0.1+0.82*f);g.rotation.y=i*2.4;grp.add(g);
  }
  if(m.gdd>=v.veg){
    const tm=new THREE.MeshLambertMaterial({color:0xd8c87a});
    for(let k=0;k<6;k++){const b=new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.012,0.4,4),tm);
      const g=new THREE.Group();g.add(b);b.position.y=0.2;b.rotation.z=0.5;g.position.y=H;g.rotation.y=k*1.05;grp.add(g)}
  }
  if(m.gdd>=m.silk){
    const gf=Math.min(1,(m.gdd-m.silk)/(v.mat*0.37));
    const cobCol=new THREE.Color(0x5aa33a).lerp(new THREE.Color(0xe8c030),Math.min(1,gf*1.4));
    const sz=(0.3+0.7*gf)*(0.5+0.5*s);
    const husk=new THREE.Color(0x6fb046).lerp(new THREE.Color(0xc9b878),Math.min(1,gf*1.2));
    [[0.55,0],[0.4,Math.PI]].forEach(([hf,ry])=>{
      const c=new THREE.Group(),L=0.34*sz+0.06;
      const hk=new THREE.Mesh(new THREE.CylinderGeometry(0.05*sz+0.015,0.075*sz+0.02,L,10),new THREE.MeshLambertMaterial({color:husk}));hk.position.y=L/2;c.add(hk);
      const tip=new THREE.Mesh(new THREE.SphereGeometry(0.05*sz+0.015,10,8),new THREE.MeshLambertMaterial({color:cobCol}));tip.position.y=L;tip.scale.y=gf>0.25?1.3:0.6;c.add(tip);
      for(let k=0;k<7;k++){const q=new THREE.Mesh(new THREE.CylinderGeometry(0.003,0.003,0.16,3),new THREE.MeshLambertMaterial({color:gf<0.5?0xd9c9a0:0x6b4a2c}));
        q.position.set(Math.cos(k)*0.02,L+0.06,Math.sin(k)*0.02);q.rotation.set(Math.sin(k)*0.5,0,Math.cos(k)*0.5);c.add(q)}
      c.position.set(0.06,H*hf,0);c.rotation.z=-0.55;
      const pg=new THREE.Group();pg.add(c);pg.rotation.y=ry;grp.add(pg);
    });
  }
}
function buildOther(grp,m,H,col,old,prog){
  const id=m.c.id,s=m.st,gdd=m.gdd,v=m.v;
  const M=c=>new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide});
  const gf=Math.min(1,Math.max(0,(gdd-v.veg)/(v.mat-v.veg)));
  if(id==='tobacco'){
    const st=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.045,H,8),M(col.clone().multiplyScalar(0.85)));st.position.y=H/2;grp.add(st);
    const nl=Math.max(3,Math.floor(Math.min(14,gdd/(v.veg/14))));
    for(let i=0;i<nl;i++){const f=i/nl,len=(0.35+0.5*(1-f*0.7))*(0.5+0.5*s)*Math.min(1,0.5+prog);
      const lf=new THREE.Mesh(makeLeaf(len,0.16*(0.6+0.4*s),0.3+0.3*(1-s)+f*0.1),M(col.clone().offsetHSL(0.01,0,i%2?0.03:-0.02).lerp(new THREE.Color(0xc8b040),gf*0.4)));
      const g=new THREE.Group();g.add(lf);g.position.y=H*(0.08+0.8*f);g.rotation.y=i*2.4;grp.add(g)}
    if(gdd>=v.veg)for(let k=0;k<9;k++){const fl=new THREE.Mesh(new THREE.SphereGeometry(0.035,6,5),M(0xe58aa8));fl.position.set(Math.cos(k*2.1)*0.1,H+0.05+(k%3)*0.04,Math.sin(k*2.1)*0.1);grp.add(fl)}
  }else if(id==='wheat'){
    const nt=Math.max(2,Math.floor(Math.min(16,gdd/60)));
    for(let i=0;i<nt;i++){const a=i*2.4,r=0.04+0.12*((i%5)/5);
      const g=new THREE.Group();g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.rotation.set(Math.sin(a)*0.12,0,Math.cos(a)*0.12);
      const th=H*(0.8+0.2*((i%3)/3));
      const sm=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.01,th,5),M(col));sm.position.y=th/2;g.add(sm);
      for(let l=0;l<2;l++){const lf=new THREE.Mesh(makeLeaf(th*0.45,0.025,0.5),M(col));const lg=new THREE.Group();lg.add(lf);lg.position.y=th*(0.3+0.25*l);lg.rotation.y=l*3.1+i;g.add(lg)}
      if(gdd>=v.veg){const ec=new THREE.Color(0x7aa83a).lerp(new THREE.Color(0xd9b44a),Math.min(1,gf*1.5));
        const ear=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),M(ec));ear.scale.set(0.02,0.09*(0.6+0.4*s),0.02);ear.position.y=th+0.05;g.add(ear);
        for(let k=0;k<6;k++){const aw=new THREE.Mesh(new THREE.CylinderGeometry(0.002,0.002,0.08,3),M(ec));aw.position.set(0,th+0.1,0);aw.rotation.z=0.25*Math.cos(k);aw.rotation.x=0.25*Math.sin(k);g.add(aw)}}
      grp.add(g)}
  }else{
    const st=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.03,H,6),M(col.clone().multiplyScalar(0.8)));st.position.y=H/2;grp.add(st);
    const nn=Math.max(2,Math.floor(Math.min(9,gdd/(v.veg/9))));
    for(let i=0;i<nn;i++){const f=(i+0.5)/nn,y=H*(0.1+0.85*f);
      for(let b=0;b<2;b++){const g=new THREE.Group();g.position.y=y;g.rotation.y=i*2.4+b*Math.PI;
        const bl=(0.1+0.3*(1-f*0.6))*(0.6+0.4*s);
        const br=new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.008,bl,4),M(col));br.position.set(bl*0.47,bl*0.18,0);br.rotation.z=-1.2;g.add(br);
        if(old<0.7)for(let t=0;t<3;t++){const lf=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),M(col.clone().offsetHSL(0,0,t*0.015)));
          lf.scale.set(0.07*(0.6+0.4*s),0.006,0.05*(0.6+0.4*s));lf.position.set(bl*0.95+Math.cos(t*2.1)*0.05,bl*0.38+0.01,Math.sin(t*2.1)*0.05);g.add(lf)}
        if(gdd>=v.veg*1.1){const pc=new THREE.Color(0x6fb046).lerp(new THREE.Color(0xb89a5a),Math.min(1,gf*1.3));
          for(let p=0;p<3;p++){const pod=new THREE.Mesh(new THREE.SphereGeometry(1,6,5),M(pc));pod.scale.set(0.012,0.04*(0.5+0.5*s),0.01);pod.position.set(bl*0.3+p*0.02,bl*0.1-0.02,(p-1)*0.012);g.add(pod)}}
        grp.add(g)}}
  }
}
function update(){
  const day=+$('day').value;$('dv').textContent=day;
  const s=sc[cur];s.crop=$('crop').value;s.v=$('var').value;s.soil=$('soil').value;s.T=+$('tmp').value;s.R=+$('rain').value;s.N=+$('nit').value;
  $('tv').textContent=s.T;$('rv').textContent=s.R;$('nv').textContent=s.N;
  ['a','b'].forEach((k,i)=>{
    const m=model(day,sc[i]);build(plants[i],m);
    grounds[i].material.color.set(m.w<0.4?0xa08558:0x6b4a2c);
    const H=m.c.h*Math.pow(Math.min(1,m.gdd/m.v.veg),0.8)*(0.45+0.55*m.st);
    $('s'+k).textContent=stage(m);$('h'+k).textContent=(m.gdd<100?0:H*0.9).toFixed(1)+' m';
    const y=m.gdd<m.silk?0:m.v.pot*m.st*Math.min(1,(m.gdd-m.silk)/(m.v.mat*0.46));
    $('y'+k).textContent=y>0?y.toFixed(1)+' t/ha':'–';
    const w=[];if(m.w<0.6)w.push('Drought');if(sc[i].R>SOIL[sc[i].soil].wl)w.push('Waterlogged');
    if(m.n<0.75)w.push('Low N');if(sc[i].T>m.c.heat)w.push('Heat');if(sc[i].T<m.c.cold)w.push('Cold');
    $('w'+k).textContent=w.join(', ')||'None';
  });
}
function sync(){const s=sc[cur];$('crop').value=s.crop;$('var').value=s.v;$('soil').value=s.soil;$('tmp').value=s.T;$('rain').value=s.R;$('nit').value=s.N}
function pick(i){cur=i;$('tA').classList.toggle('on',i==0);$('tB').classList.toggle('on',i==1);sync();update()}
$('tA').onclick=()=>pick(0);$('tB').onclick=()=>pick(1);
['day','crop','var','soil','tmp','rain','nit'].forEach(i=>$(i).addEventListener('input',update));
sync();update();
(function loop(){requestAnimationFrame(loop);cam.position.set(Math.sin(ang)*7,2.2,Math.cos(ang)*7);cam.lookAt(0,1.1,0);ren.render(scene,cam)})();
</script></body></html>
